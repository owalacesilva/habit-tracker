<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Habit Tracker</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        background: #fbf4ee;
        color: #2f1f17;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #8c7a6e;
        font-size: 0.875rem;
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 1.75rem;
        background: #ff6b00;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <span style="font-size: 2.5rem" aria-hidden="true">🌙</span>
    <h1>You're offline</h1>
    <p>Your habits are waiting — reconnect to pick up where you left off.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
